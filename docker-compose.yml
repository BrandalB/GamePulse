services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gamepulse
      POSTGRES_PASSWORD: gamepulse
      POSTGRES_DB: gamepulse
    ports:
      - '5432:5432'
    volumes:
      - gamepulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamepulse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gamepulse_pgdata:
